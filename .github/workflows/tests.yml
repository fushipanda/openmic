name: Tests

# CI gates the dev -> main pipeline: it runs on pull requests targeting main.
on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      # Formatting is not yet enforced: `ruff format` would rewrite 19 files.
      # Reported so the drift stays visible, but it does not fail the build.
      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: pip install -e ".[dev,local,anthropic,openai,mcp]"

      # openmic-mcp is a declared console script with no test coverage; without
      # this it can ship broken and nothing notices.
      - name: Smoke-test the MCP entry point
        run: python -c "import openmic.mcp_server"

      - name: Run tests
        run: pytest tests/ -v
